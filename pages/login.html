<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login</title>
</head>

<body>

    <div id="login-container">

        <div id="login-form">

            <h1>Student Login</h1>

            <form>

                <label for="email">Email / Username</label>
                <br><br>

                <input
                    type="text"
                    id="email"
                    name="email"
                    placeholder="Enter Email or Username"
                >

                <br><br>

                <label for="password">Password</label>

                <br><br>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter Password"
                >

                <br><br><br>

                <button type="submit">
                    Log In
                </button>

            </form>

        </div>

        <div id="logo-section">


        </div>

    </div>

</body>
</html>
