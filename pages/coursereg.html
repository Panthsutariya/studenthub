<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Course Registration</title>
    <link rel="stylesheet" href="../css/coursereg.css">
</head>

<body>

<h1 align="center">Course Registration Form</h1>

<form action="#" method="post" onsubmit="return validateForm()">

<table cellpadding="8">

<tr>
    <td>Student Name</td>
    <td><input type="text" name="name" required></td>
</tr>

<tr>
    <td>Student ID</td>
    <td><input type="text" name="id" required></td>
</tr>

<tr>
    <td>Email</td>
    <td><input type="email" name="email" required></td>
</tr>

<tr>
    <td>Mobile Number</td>
    <td><input type="tel" name="mobile" required></td>
</tr>

<tr>
    <td>Password</td>
    <td><input type="password" id="password" required></td>
</tr>

<tr>
    <td>Confirm Password</td>
    <td><input type="password" id="confirmPassword" required></td>
</tr>

<tr>
    <td>Branch</td>
    <td>
        <select name="branch" required>
            <option value="">Select Branch</option>
            <option>Computer Engineering</option>
            <option>Information Technology</option>
            <option>Mechanical Engineering</option>
            <option>Civil Engineering</option>
            <option>Electrical Engineering</option>
        </select>
    </td>
</tr>

<tr>
    <td>Year</td>
    <td>
        <select name="year" required>
            <option value="">Select Year</option>
            <option>1st Year</option>
            <option>2nd Year</option>
            <option>3rd Year</option>
            <option>4th Year</option>
        </select>
    </td>
</tr>

<tr>
    <td>Course Selection</td>
    <td>
        <input type="checkbox" name="course" value="WDF"> WDF<br>
        <input type="checkbox" name="course" value="OOP"> OOP<br>
        <input type="checkbox" name="course" value="FDSA"> FDSA<br>
        <input type="checkbox" name="course" value="FCN"> FCN<br>
        <input type="checkbox" name="course" value="Mathematics"> Mathematics
    </td>
</tr>

<tr>
    <td>Gender</td>
    <td>
        <input type="radio" name="gender" value="Male"> Male
        <input type="radio" name="gender" value="Female"> Female
        <input type="radio" name="gender" value="Other"> Other
    </td>
</tr>

<tr>
    <td>Study Mode</td>
    <td>
        <input type="radio" name="mode" value="Regular"> Regular
        <input type="radio" name="mode" value="Online"> Online
    </td>
</tr>

<tr>
    <td>Address</td>
    <td>
        <textarea name="address" rows="4" cols="30"></textarea>
    </td>
</tr>

<tr>
    <td>Date</td>
    <td><input type="date" name="date"></td>
</tr>

<tr>
    <td>Terms</td>
    <td>
        <input type="checkbox" id="terms">
        I accept the terms and conditions
    </td>
</tr>

<tr>
    <td colspan="2" align="center">
        <input type="submit" value="Register">
        <input type="reset" value="Clear">
        <input type="button" value="Back" onclick="window.location.href='index.html'">
    </td>
</tr>

</table>

</form>

<script src="../js/site-data.js"></script>
<script src="../js/site-ui.js"></script>

</body>
</html>
